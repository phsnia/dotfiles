# ~/.config/tmux/tmux.conf — linked by the dotfiles stage.

# --- Terminal ---
set -g default-terminal "tmux-256color"     # terminfo ships with ncurses
set -as terminal-features ",*:RGB"          # 24-bit colour, matches Alacritty
set -g escape-time 10                       # snappier Esc for vim/neovim
set -g focus-events on

# --- Behaviour ---
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on                     # OSC 52 -> X selection

# --- Key bindings (Alt is i3's $mod, so tmux keeps the default C-b) ---
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Copy mode: vi ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# --- Status bar (font comes from the terminal: Alacritty uses Comic Mono) ---
set -g status-interval 5
set -g status-left-length 24
set -g status-right-length 60
set -g status-style "fg=colour252,bg=colour235"
set -g status-left "#[bold] #S #[nobold]"
set -g status-right "#[fg=colour244]#{?client_prefix,#[fg=colour214]PREFIX ,}%Y-%m-%d %H:%M "
setw -g window-status-format " #I:#W#{?window_flags,#{window_flags}, } "
setw -g window-status-current-format " #I:#W#{?window_flags,#{window_flags}, } "
setw -g window-status-current-style "fg=colour235,bg=colour250,bold"
setw -g pane-border-style "fg=colour238"
setw -g pane-active-border-style "fg=colour250"
